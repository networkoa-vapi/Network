{% load static cache_bust %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - NOA ERP</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v={% static_version 'css/styles.css' %}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo" style="background: white; padding: 10px;">
            <img src="/media/company_logos/noa_erp_logo.png" alt="NOA" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h2 class="login-title">Check Your Email</h2>
        <p class="login-subtitle">If an account exists for that email address, we've sent a link to reset your password. It may take a few minutes to arrive.</p>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'portal_login' %}">← Back to Sign In</a>
        </p>
    </div>
</body>
</html>
