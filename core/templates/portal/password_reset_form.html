{% load static cache_bust %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NOA ERP</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v={% static_version 'css/styles.css' %}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo" style="background: white; padding: 10px;">
            <img src="/media/company_logos/noa_erp_logo.png" alt="NOA" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h2 class="login-title">Forgot Password?</h2>
        <p class="login-subtitle">Enter your account email and we'll send you a link to reset it.</p>

        {% if form.errors %}
        <div style="color: var(--danger); font-size: 14px; margin-bottom: 20px; font-weight: 500;">
            <p>Please enter a valid email address.</p>
        </div>
        {% endif %}

        <form method="post" style="text-align: left;">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 30px;">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required placeholder="you@example.com" autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Send Reset Link</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'portal_login' %}">← Back to Sign In</a>
        </p>
    </div>
</body>
</html>
